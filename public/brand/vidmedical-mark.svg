       L366 236
       C373 240 373 252 366 256
       L214 346
       C206 350 198 344 198 336
       Z"
    fill="#1f8a7a"
  />

  <!-- ECG / pulse line — also reads as M + V -->
  <path
    d="M78 256
       H168
       L196 256
       L228 168
       L268 344
       L308 208
       L336 256
       H434"
