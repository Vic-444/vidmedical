<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="VidMedical Studio">
  <!-- Rounded tile -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#fbfcfc"/>
  <!-- Soft edge for light-on-light contexts -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="#e8eef1" stroke-width="8"/>

  <!-- Play triangle (video) -->
  <path
    d="M198 156
